# Reusable quality gate — static / Docker demo (no Node app required).
name: Reusable quality

on:
  workflow_call:
    inputs:
      # Kept for API compatibility with the full-stack kit; unused here.
      node_version:
        required: false
        type: string
        default: "22"
      upload_dist:
        required: false
        type: boolean
        default: false
      run_coverage:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: Validate demo assets
        run: |
          set -euo pipefail
          test -f app/index.html
          test -f app/nginx.conf
          grep -q 'location = /health' app/nginx.conf
          grep -q 'listen 8080' app/nginx.conf

      - name: Build candidate image (smoke build)
        run: |
          set -euo pipefail
          docker build \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg VERSION="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" \
            -t supply-chain-web:quality \
            .

      - name: Container /health
        run: |
          set -euo pipefail
          docker run -d --name sc-quality -p 18080:8080 supply-chain-web:quality
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/health | grep -q OK; then
              echo "health OK"
              docker rm -f sc-quality
              exit 0
            fi
            sleep 1
          done
          docker logs sc-quality || true
          docker rm -f sc-quality || true
          exit 1

      - name: Quality summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## Quality gate (static demo)"
            echo ""
            echo "- Hadolint on \`Dockerfile\`"
            echo "- Required files: \`app/index.html\`, \`app/nginx.conf\` + \`/health\`"
            echo "- Local image build + HTTP health on :18080"
          } >> "$GITHUB_STEP_SUMMARY"
