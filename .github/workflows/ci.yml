name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
      - "release/**"
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/reusable-quality.yml

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source /src --verbose --redact

  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

  sonar:
    name: SonarQube
    # When SONAR_* secrets exist: quality gate is fail-closed (sonar.qualitygate.wait).
    # When secrets are absent: job succeeds after an explicit skip.
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop'))
    needs:
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ran: ${{ steps.sonar-ready.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect Sonar secrets
        id: sonar-ready
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube secrets not configured — skipping (configure SONAR_TOKEN + SONAR_HOST_URL to enforce QG)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SonarQube enabled — quality gate will block on failure."
          fi

      - name: SonarQube scan (fail-closed quality gate)
        if: steps.sonar-ready.outputs.enabled == 'true'
        # Community Build: do NOT pass sonar.branch.name / sonar.pullrequest.*
        # (those require Developer Edition+).
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=supply-chain-demo
            -Dsonar.sources=app,deploy,.github/scripts
            -Dsonar.exclusions=**/*.md,**/node_modules/**
            -Dsonar.qualitygate.wait=true

  ci-summary:
    name: CI summary
    if: always()
    needs:
      - quality
      - secret-scan
      - dockerfile-lint
      - sonar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write summary
        run: |
          {
            echo "## CI gate"
            echo ""
            echo "| Job | Result |"
            echo "| --- | ------ |"
            echo "| quality | ${{ needs.quality.result }} |"
            echo "| secret-scan | ${{ needs.secret-scan.result }} |"
            echo "| dockerfile-lint | ${{ needs.dockerfile-lint.result }} |"
            echo "| sonar | ${{ needs.sonar.result }} |"
            echo ""
            echo "- Ref: \`${{ github.ref_name }}\` · SHA: \`$(echo '${{ github.sha }}' | cut -c1-7)\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in \
            "${{ needs.quality.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.dockerfile-lint.result }}"
          do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              failed=1
            fi
          done

          # Sonar: skipped when secrets absent / branch outside if; failure blocks when it ran.
          if [ "${{ needs.sonar.result }}" = "failure" ]; then
            echo "SonarQube quality gate failed."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "CI gate failed."
            exit 1
          fi
          echo "CI gate passed."
