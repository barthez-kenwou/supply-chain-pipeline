name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "hotfix/**"
      - "release/**"
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/reusable-quality.yml

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source /src --no-git --verbose --redact

  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

  sonar:
    name: SonarQube
    # When SONAR_* secrets exist: quality gate is fail-closed (sonar.qualitygate.wait).
    # When secrets are absent: job succeeds after an explicit skip.
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop'))
    needs:
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ran: ${{ steps.sonar-ready.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect Sonar secrets
        id: sonar-ready
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube secrets not configured — skipping (configure SONAR_TOKEN + SONAR_HOST_URL to enforce QG)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SonarQube enabled — quality gate will block on failure."
          fi

      - name: SonarQube scan (fail-closed quality gate)
        id: sonar-scan
        if: steps.sonar-ready.outputs.enabled == 'true'
        # Community Build: do NOT pass sonar.branch.name / sonar.pullrequest.*
        # (those require Developer Edition+).
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.verbose=true

      - name: Print Sonar quality gate conditions on failure
        if: failure() && steps.sonar-ready.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          REPORT=".scannerwork/report-task.txt"
          if [ ! -f "$REPORT" ]; then
            echo "No report-task.txt"
            find .scannerwork -maxdepth 2 -type f | head -50 || true
            exit 0
          fi
          cat "$REPORT"
          # Use python urllib with token — same host the scanner already reached
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          host=os.environ["SONAR_HOST_URL"].rstrip("/")
          token=os.environ["SONAR_TOKEN"]
          url=f"{host}/api/qualitygates/project_status?projectKey=supply-chain-demo"
          req=urllib.request.Request(url)
          req.add_header("Authorization", "Bearer " + token)
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data=json.load(r)
          except Exception as e:
              print("Bearer failed", e)
              import base64
              basic=base64.b64encode((token+":").encode()).decode()
              req=urllib.request.Request(url)
              req.add_header("Authorization", "Basic " + basic)
              with urllib.request.urlopen(req, timeout=30) as r:
                  data=json.load(r)
          print(json.dumps(data, indent=2))
          status=data.get("projectStatus",{})
          print("QG", status.get("status"))
          for c in status.get("conditions", []):
              print(f"COND {c.get('status')} metric={c.get('metricKey')} actual={c.get('actualValue')} error={c.get('errorThreshold')} comparator={c.get('comparator')}")
          # Issues
          iurl=f"{host}/api/issues/search?componentKeys=supply-chain-demo&resolved=false&ps=100"
          req=urllib.request.Request(iurl)
          req.add_header("Authorization", "Bearer " + token)
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  issues=json.load(r)
          except Exception:
              import base64
              basic=base64.b64encode((token+":").encode()).decode()
              req=urllib.request.Request(iurl)
              req.add_header("Authorization", "Basic " + basic)
              with urllib.request.urlopen(req, timeout=30) as r:
                  issues=json.load(r)
          print("ISSUES", issues.get("total"))
          for i in issues.get("issues", []):
              print(f"{i.get('severity')}\t{i.get('type')}\t{i.get('rule')}\t{i.get('component','').split(':')[-1]}:{i.get('line')}\t{i.get('message')}")
          hurl=f"{host}/api/hotspots/search?projectKey=supply-chain-demo&status=TO_REVIEW&ps=50"
          req=urllib.request.Request(hurl)
          req.add_header("Authorization", "Bearer " + token)
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  hot=json.load(r)
              print("HOTSPOTS", hot.get("paging",{}).get("total"))
              for h in hot.get("hotspots", []):
                  print(f"HOTSPOT\t{h.get('ruleKey')}\t{h.get('component','').split(':')[-1]}:{h.get('line')}\t{h.get('message')}")
          except Exception as e:
              print("hotspots fetch failed", e)
          PY

  ci-summary:
    name: CI summary
    if: always()
    needs:
      - quality
      - secret-scan
      - dockerfile-lint
      - sonar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write summary
        run: |
          {
            echo "## CI gate"
            echo ""
            echo "| Job | Result |"
            echo "| --- | ------ |"
            echo "| quality | ${{ needs.quality.result }} |"
            echo "| secret-scan | ${{ needs.secret-scan.result }} |"
            echo "| dockerfile-lint | ${{ needs.dockerfile-lint.result }} |"
            echo "| sonar | ${{ needs.sonar.result }} |"
            echo ""
            echo "- Ref: \`${{ github.ref_name }}\` · SHA: \`$(echo '${{ github.sha }}' | cut -c1-7)\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in \
            "${{ needs.quality.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.dockerfile-lint.result }}"
          do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              failed=1
            fi
          done

          # Sonar: skipped when secrets absent / branch outside if; failure blocks when it ran.
          if [ "${{ needs.sonar.result }}" = "failure" ]; then
            echo "SonarQube quality gate failed."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "CI gate failed."
            exit 1
          fi
          echo "CI gate passed."
